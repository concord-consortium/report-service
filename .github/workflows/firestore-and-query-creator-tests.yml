# The filename is historical. This workflow now covers three packages: the Firestore access rules
# (tests/), the cloud functions (functions/) and the query creator (query-creator/).
name: Run Firestore, Functions and QueryCreator Tests
on:
  push:
    paths:
      - 'functions/**'
      - 'query-creator/**'
      # Without this, a change to the jobs below never runs them, so a broken workflow edit lands
      # green and only fails on the next push that happens to touch a watched directory.
      - '.github/workflows/firestore-and-query-creator-tests.yml'
jobs:
  test_rules:
    name: Firestore Access Rule Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - uses: actions/setup-node@v1
        with:
          node-version: '18'
      - run: npm install -g firebase-tools
      - run: npm ci
        working-directory: tests
      - run: firebase -c ../firebase.json emulators:exec --only firestore "npm test"
        working-directory: tests
  test_functions:
    name: Functions Lint, Unit and Emulator Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: functions/package-lock.json
      # The Firestore emulator is a Java process, and firebase-tools 15 refuses to start it on a JDK
      # older than 21. The runner's default JDK is older, so pin one rather than inherit it. The
      # rules job below escapes this only because on node 18 npm resolves an older firebase-tools.
      #
      # No global `npm install -g firebase-tools` here, deliberately: functions/package.json carries
      # firebase-tools as a devDependency, so `npm ci` installs it and `test:emulator`'s `npx
      # firebase` prefers node_modules/.bin. The emulator version, and therefore the JDK requirement
      # above, comes from the lockfile. A global install would only imply it controls that version.
      # The rules job still needs its own, since it invokes `firebase` bare from tests/.
      - run: npm ci
        working-directory: functions
      - run: npm run lint
        working-directory: functions
      # Deliberately no `npm run build`: tsc emits compiled copies of every *.test.ts into lib/,
      # and four of them fail on jest 24's inability to resolve firebase-admin/auth through
      # firebase-admin's subpath exports. lib/ is gitignored, so a CI checkout never has it.
      - run: npm test
        working-directory: functions
      - run: npm run test:emulator
        working-directory: functions
  test_query_creator:
    name: Query Creator Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - uses: actions/setup-node@v1
        with:
          node-version: '18'
      - run: npm ci
        working-directory: query-creator/create-query
      - run: npm run test
        working-directory: query-creator/create-query
