name: Run Firestore and QueryCreator Tests
on:
  push:
    paths:
      - 'functions/**'
      - 'query-creator/**'
jobs:
  test_rules:
    name: Firestore Access Rule Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - uses: actions/setup-node@v1
        with:
          node-version: '18'
      - run: npm install -g firebase-tools
      - run: npm ci
        working-directory: tests
      - run: firebase -c ../firebase.json emulators:exec --only firestore "npm test"
        working-directory: tests
  test_functions:
    name: Functions Lint, Unit and Emulator Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install -g firebase-tools
      - run: npm ci
        working-directory: functions
      - run: npm run lint
        working-directory: functions
      # Deliberately no `npm run build`: tsc emits compiled copies of every *.test.ts into lib/,
      # and four of them fail on jest 24's inability to resolve firebase-admin/auth through
      # firebase-admin's subpath exports. lib/ is gitignored, so a CI checkout never has it.
      - run: npm test
        working-directory: functions
      - run: npm run test:emulator
        working-directory: functions
  test_query_creator:
    name: Query Creator Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - uses: actions/setup-node@v1
        with:
          node-version: '18'
      - run: npm ci
        working-directory: query-creator/create-query
      - run: npm run test
        working-directory: query-creator/create-query
