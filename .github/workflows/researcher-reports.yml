name: Researcher Reports CI
# This app is retired; the deploy runs by hand only. Do not restore a `push` trigger
# without reading doc/deploy.md — `paths` filters do not apply to tag pushes.
on:
  workflow_dispatch:
  # ⚠️ TEMPORARY — REVERT BEFORE MERGING THIS PR. ⚠️
  # Proves the OIDC deploy works before merge, since `workflow_dispatch` cannot be
  # started until it is on the default branch. Scoped to this one branch, which is
  # not in `topBranches`, so the deploy writes only to
  # branch/oidc-auth-for-s3-deployment/ and touches nothing at the top level.
  push:
    branches: [DEV-185-oidc-auth-for-s3-deployment]
defaults:
  run:
    working-directory: researcher-reports
jobs:
  build_test:
    name: Build and Run Jest Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: '16'
      - name: Install Dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Run Tests
        run: npm run test:coverage -- --runInBand
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v2
        with:
          flags: jest
  cypress:
    if: ${{ false }}  # disable for now
    runs-on: ubuntu-latest
    strategy:
      # when one test fails, DO NOT cancel the other
      # containers, because this will kill Cypress processes
      # leaving the Dashboard hanging ...
      # https://github.com/cypress-io/github-action/issues/48
      fail-fast: false
      matrix:
        # run 3 copies of the current job in parallel
        containers: [1, 2, 3]
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      - uses: cypress-io/github-action@v2
        with:
          working-directory: ./researcher-reports
          start: npm start
          wait-on: 'http://localhost:8080'
          # only record the results to dashboard.cypress.io if CYPRESS_RECORD_KEY is set
          record: ${{ !!secrets.CYPRESS_RECORD_KEY }}
          # only do parallel if we have a record key
          parallel: ${{ !!secrets.CYPRESS_RECORD_KEY }}
        env:
          # pass the Dashboard record key as an environment variable
          CYPRESS_RECORD_KEY: ${{ secrets.CYPRESS_RECORD_KEY }}
          # pass GitHub token to allow accurately detecting a build vs a re-run build
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # turn on code coverage when running npm start
          # so far we've been using a webpack istanbul-instrumenter-loader for this
          # but there has been work on building code coverage into node itself, which
          # should be much faster
          CODE_COVERAGE: true
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v2
        with:
          flags: cypress
  s3-deploy:
    name: S3 Deploy
    needs:
      - build_test
      #- cypress
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: '16'
      - name: Install Dependencies
        run: npm ci
        env:
          # skip installing cypress since it isn't needed for just building
          # This decreases the deploy time quite a bit
          CYPRESS_INSTALL_BINARY: 0
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::612297603577:role/report-service
          aws-region: us-east-1
      - uses: concord-consortium/s3-deploy-action@v1
        with:
          bucket: models-resources
          prefix: researcher-reports
          workingDirectory: ./researcher-reports
          # Parameters to GHActions have to be strings, so a regular yaml array cannot
          # be used. Instead the `|` turns the following lines into a string
          topBranches: |
            ["master"]